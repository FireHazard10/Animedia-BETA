      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=M+PLUS+Rounded+1c:wght@700&display=swap"
      rel="stylesheet"
    />

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

    <style>
      :root {
        --accent: #ffb700;
        --accent-glow: rgba(255, 183, 0, 0.3);
        --bg-dark: #0a0a0c;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.1);
        --text-main: #ffffff;
        --text-muted: #a0a0a8;
      }

      body {
        background-color: var(--bg-dark);
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(230, 149, 0, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(at 100% 100%, rgba(0, 0, 0, 1) 0px, transparent 50%);
        font-family: "Inter", sans-serif;
        color: var(--text-main);
        min-height: 100vh;
      }

      main {
        padding: 60px 20px;
        max-width: 1400px;
        margin: auto;
      }

      /* --- Grid Configuration --- */
      #alphcard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }

      /* --- Sleek Card Design --- */
      .alphcard {
        position: relative;
        display: flex;
        height: 85px; /* Compact height */
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .alphcard:hover {
        transform: translateY(-5px) scale(1.02);
        border-color: var(--accent);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 15px var(--accent-glow);
      }

      /* Image Section */
      .alphcard-img {
        width: 35%;
        height: 100%;
        position: relative;
        overflow: hidden;
        border-right: 1px solid var(--card-border);
      }

      .alphcard-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(20%);
        transition: transform 0.6s ease;
      }

      .alphcard:hover img {
        transform: scale(1.15);
        filter: grayscale(0%);
      }

      /* Content Section */
      .alphcard-info {
        width: 65%;
        padding: 10px 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0%,
          transparent 100%
        );
      }

      .alphcard-title {
        font-family: "Inter", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-main);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .alphcard-date {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* --- Enhanced Button Design --- */
      .next-btn {
        background: transparent;
        color: var(--accent);
        border: 1px solid transparent;
        padding: 14px 40px;
        font-size: 0.95rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-radius: 50px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
      }

      /* Neon border effect */
      .next-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 50px;
        padding: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.7;
        transition: opacity 0.4s ease;
      }

      /* Inner glow effect */
      .next-btn::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          var(--accent-glow) 0%,
          transparent 70%
        );
        transition:
          width 0.5s ease,
          height 0.5s ease;
        z-index: -1;
      }

      /* Hover effects */
      .next-btn:hover {
        color: #000;
        background: var(--accent);
        box-shadow:
          0 0 25px var(--accent-glow),
          0 0 40px rgba(0, 217, 255, 0.3);
        letter-spacing: 2.5px;
        transform: translateY(-3px);
      }

      .next-btn:hover::before {
        opacity: 1;
        background: linear-gradient(
          90deg,
          var(--accent),
          #00f7ff,
          var(--accent)
        );
        animation: border-glow 2s linear infinite;
      }

      .next-btn:hover::after {
        width: 150%;
        height: 150%;
      }

      /* Pulsing animation */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }
        100% {
          box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }
      }

      @keyframes border-glow {
        0% {
          background-position: -100px 0;
        }
        100% {
          background-position: 100px 0;
        }
      }

      /* Icon animation */
      .next-btn i {
        margin-right: 8px;
        transition: transform 0.4s ease;
      }

      .next-btn:hover i {
        transform: translateX(3px) rotate(90deg);
      }

      /* Loading animation state */
      .next-btn.loading {
        pointer-events: none;
        color: transparent;
      }

      .next-btn.loading::before {
        animation: border-glow 1s linear infinite;
      }

      .next-btn.loading::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        border: 2px solid transparent;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        transform: translate(-50%, -50%);
        background: transparent;
      }

      @keyframes spin {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* --- Futuristic Load More Button --- */
      .button-container {
        display: flex;
        justify-content: center;
        margin-top: 60px;
      }

      .alphcard {
        animation: fadeInUp 0.6s ease backwards;
      }
    </style>

      function sortData() {

          currentIndex + itemsPerPage,

          alphcard.classList.add("alphcard");

            <div class="alphcard-img">
              <img src="${item.img}" alt="${item.title}" loading="lazy">
            </div>
            <div class="alphcard-info">
              <div class="alphcard-title">${item.title}</div>
              <div class="alphcard-date">${item.date}</div>
            </div>
          `;

        });
